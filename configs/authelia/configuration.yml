# This file is safe to commit as-is — it has no secrets and no per-host
# literals. Every host-specific or secret value below is resolved by
# Authelia itself at startup, via its own built-in "template" config
# filter (docs: configuration/methods/files.md#file-filters). Two real
# uses appear below: the domain fields, via the env function reading
# AUTH_DOMAIN / INCUS_UI_DOMAIN (set via authelia.profile.yaml's
# environment.* keys), and the OIDC signing key, via fileContent piped
# through nindent — needed because it's nested inside a list (jwks),
# which Authelia's *_FILE secret mechanism explicitly can't reach (lists
# of objects are excluded — see the secrets doc).
#
# Everything else marked "secret" loads from a *_FILE environment
# variable automatically, because its key ends in key/secret/password/
# token/certificate_chain — Authelia's own convention, not this filter.
# See scripts/generate-authelia-secrets.sh and authelia.profile.yaml for
# where those env vars and files come from.
#
# Requires environment.X_AUTHELIA_CONFIG_FILTERS=template on the instance
# (set in authelia.profile.yaml) — without it, the template actions
# mentioned above are treated as literal text instead of being resolved.
#
# IMPORTANT: that also means this entire file, comments included, is live
# template input — Authelia's template engine has no concept of a YAML
# comment, it just sees text. Never write a literal double-brace pair in
# a comment here, even to describe the syntax: an earlier version of this
# comment did exactly that (showing the fileContent pattern above with a
# placeholder "N" for the indent width, written as real double-brace
# syntax) and broke startup outright — every value below silently failed
# to resolve, and Authelia refused to boot with the actual reason buried
# under a wall of resulting "required" errors, because the engine tried
# to call a function literally named N and none exists.

theme: light

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

# identity_validation.reset_password.jwt_secret: omitted entirely (not just
# left empty) — supplied via AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE.
# Authelia merges *_FILE secrets in by their full key path, so this section
# doesn't need to appear here at all; an empty-string placeholder would count
# as "also defined in the file" and Authelia refuses to start on that conflict.

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "AUTH_DOMAIN" }}'
      policy: one_factor
    - domain: '{{ env "INCUS_UI_DOMAIN" }}'
      policy: one_factor

session:
  # secret: omitted — AUTHELIA_SESSION_SECRET_FILE
  cookies:
    - domain: '{{ env "AUTH_DOMAIN" }}'
      authelia_url: 'https://{{ env "AUTH_DOMAIN" }}'

storage:
  # encryption_key: omitted — AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    # hmac_secret: omitted — AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
    jwks:
      - key_id: 'incus'
        algorithm: 'RS256'
        key: |
          {{- fileContent "/config/secrets/oidc.key" | nindent 10 }}
    enforce_pkce: 'public_clients_only'
    clients:
      - client_id: 'incus'
        client_name: 'Incus'
        public: true
        authorization_policy: one_factor
        audience:
          - 'incus'
        redirect_uris:
          - 'https://{{ env "INCUS_UI_DOMAIN" }}/oidc/callback'
        scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        token_endpoint_auth_method: none
        access_token_signed_response_alg: 'RS256' # Incus expects a JWT access token, not Authelia's default opaque one
      # Second real OIDC client, added 2026-09-17 for nextcloud-incus
      # (github.com/wyomarus/nextcloud-incus) — the platform's first
      # confidential (non-public) client, unlike incus's own public/PKCE
      # one. redirect_uris uses a literal domain, not a templated
      # ${VAR}/env-function like AUTH_DOMAIN/INCUS_UI_DOMAIN above,
      # deliberately: those two describe this platform's own two built-in
      # domains, but a tenant app's domain is that tenant's own concern
      # (same reasoning nightscout-app.profile.yaml hardcodes its own
      # BASE_URL rather than being templated by this repo). Currently
      # nc.test.greenlock.cloud, the homelabvps rehearsal target — update
      # here (and reissue a client secret) at the real incus.xlii.co
      # production cutover rather than assuming this value still applies.
      # client_secret is the pbkdf2-sha512 hash from `incus exec authelia
      # -- authelia crypto hash generate pbkdf2 --variant sha512 --random
      # --random.length 72 --random.charset rfc3986` — the plaintext goes
      # to Nextcloud's own `occ user_oidc:provider` command, never here.
      #
      # token_endpoint_auth_method is client_secret_post, not the more
      # common client_secret_basic — not a style choice, Nextcloud's
      # user_oidc app actually sends its credentials in the POST body.
      # First attempt used client_secret_basic (the more typical default
      # for a confidential client) and failed hard: Authelia's own log
      # spelled out the exact mismatch ("Access Request failed...
      # registered client... configured to only support... basic...
      # Relying Party will need to be configured to use... post"). If a
      # future OIDC client here fails the same way, check what its RP
      # actually sends before assuming basic is correct.
      - client_id: 'nextcloud'
        client_name: 'Nextcloud'
        client_secret: '$pbkdf2-sha512$310000$o532aHjq04zrri4pH6nrKA$qgG7RPbXLX7FyVUXlN.cRKqjFcVF/BHDepuraXXnTFLWbcmpS1zpyDy.TxPC8G7EccZCK9mz0W8WqVuIZM5IXw'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - 'https://nc.test.greenlock.cloud/apps/user_oidc/code'
        scopes:
          - openid
          - profile
          - email
          - groups
          - offline_access
        grant_types:
          - authorization_code
          - refresh_token
        response_types:
          - code
        token_endpoint_auth_method: client_secret_post
