name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned rather than the floating "ubuntu-latest" label, which GitHub
    # has announced will migrate to Ubuntu 26 on 2026-10-19 (see
    # actions/runner-images#14748) -- upgrading a CI base image is a
    # deliberate decision to make and test, not something that should
    # happen to this workflow silently on a fixed calendar date.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      # tink is a client as well as a host tool: it is run from Windows with --remote. Keep the command building there, so a unix-only
      # import is caught on the pull request that adds it, not when someone downloads the release (a release builds these too).
      - name: build for Windows
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/tink
          done
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go test -race ./...
