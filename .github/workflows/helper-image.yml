name: helper image

# Builds the tink helper image (build/helper/Containerfile) for amd64 and arm64.
#
# On a tag (v*) it also publishes it to ghcr.io/minihci/tink-helper:<tag>: the image `tink helper install` picks for a release build of
# the same version. On a pull request that touches the image it only builds, so a broken Containerfile or workflow is found before a
# release, not during one.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "build/helper/**"
      - ".github/workflows/helper-image.yml"

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/minihci/tink-helper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # The version compiled into the binary (and so reported by `tink version` and used by `tink helper install` to pick its image) is
      # the tag. A build that is not a tag says so, and `install` then asks for --image or --binary instead of guessing.
      - name: version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: build the binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.injectedVersion=${{ steps.v.outputs.version }}" \
              -o "dist/tink-linux-$arch" ./cmd/tink
          done

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=ref,event=tag

      - name: build${{ github.ref_type == 'tag' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/helper/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: digest
        if: github.ref_type == 'tag'
        run: |
          {
            echo "### Published"
            echo
            echo "\`$IMAGE:${GITHUB_REF_NAME}\`"
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
