# The herd stack "vault": Vaultwarden. Imported from the project's compose file with `tink import`; the lines marked "site:" are the
# site's half, written by hand: what is left of it once the derive stage has done the rest (a project, the offer, the name, the grant, the
# backup answer).
kind: stack
name: vault
network: own                              # a bridge, its ACL and the apps' static addresses are derived (docs/network.md)
project: herd-vault                       # site: a project of its own
site: herd                              # site: only needed on a server that has a platform already (docs/join.md#sites)
---
kind: project
name: herd-vault
config:
  features.profiles: "false"
---
kind: backup-target                       # site: where copies go. A target has to be in the same load as the volumes that name it, so each stack that copies repeats it
name: vmpool
location: same-host
engine: incus
pool: vm
---
kind: storage-volume
name: vaultwarden-vw-data
pool: default
backup:                                   # site: the backup answer the importer left open. A copy to another pool on this server is not off-site; plan says so
  snapshots: {schedule: "0 3 * * *", retain: 14d}
  copies:
    - {target: vmpool, schedule: "0 4 * * *", retain: 30d}
  verify:
    every: weekly
    check:
      image: docker-oci:library/alpine:3
      command: [sh, -c, "test -s /data/db.sqlite3"]
---
kind: instance
name: vaultwarden
image: vaultwarden/server:latest
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.DOMAIN: https://vault.home.example.org     # site: the name the app is told it has (the compose file said vw.domain.tld)
  user.tink.offer.web.port: "80"                         # site: the offer the join reads
  user.tink.offer.web.proto: http
devices:
  # (the compose file's `127.0.0.1:8000:80` host port is gone: the app is reached through the ingress helper)  # site
  volume0:
    type: disk
    path: /data/
    pool: default
    source: vaultwarden-vw-data
---
kind: publish                             # site: the name, and who may use it
name: vault
instance: vaultwarden
offer: web
allow: [family]
