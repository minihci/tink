# The shared site the herd test applies stacks to: a DNS helper, a sign-on helper and an ingress helper on one platform bridge, in a
# project of their own. A fixture, not the platform recipe (#131): the addresses and the zone are the documentation ones, certificates
# are Caddy's own local CA, and the site's one user is a throwaway.
#
# Put the platform bridge and the bridges tink makes for the stacks (named tink-*) in a firewall zone that lets them reach the host's DHCP and DNS
# (README.md), apply this file, then the stacks, then this file again: three of its files (derive:) hold what the stacks publish, and follow them.
kind: stack
name: herd-site
project: herd-site
---
kind: project
name: herd-site
config:
  features.profiles: "false"
---
kind: network
name: herd0
description: the herd test's platform bridge
config:
  ipv4.address: 192.0.2.1/24
  ipv4.nat: "true"
  ipv6.address: none
---
kind: instance
name: dns
image: docker-oci:coredns/coredns:1.15.0
profiles: [default]
config:
  boot.autostart: "true"
  boot.autorestart: "true"
  user.tink.role: dns
  user.tink.dns.zone: home.example.org
devices:
  eth0: {name: eth0, type: nic, network: herd0, ipv4.address: 192.0.2.10}
---
kind: file
name: dns-corefile
instance: dns
path: /Corefile
source_path: files/Corefile
restart: true
---
kind: file
name: dns-zone
instance: dns
path: /db.home.example.org
source_path: files/db.home.example.org
restart: true
---
kind: file
name: dns-hosts
instance: dns
path: /hosts
source_path: files/hosts
derive: dns                    # the generated records; the platform's own names are in the zone file above. CoreDNS re-reads it, so no restart
---
kind: instance
name: sso
image: docker-oci:authelia/authelia:4.39.28
profiles: [default]
config:
  boot.autostart: "true"
  boot.autorestart: "true"
  user.tink.role: sso
  user.tink.offer.web.port: "9091"
  user.tink.offer.web.proto: http
  # The image reads /config, which it does not have, and a file cannot be placed in a directory that is not there (#140), so it is
  # pointed at /app, which is.
  oci.entrypoint: authelia --config /app/configuration.yml
devices:
  eth0: {name: eth0, type: nic, network: herd0, ipv4.address: 192.0.2.11}
---
kind: file
name: sso-configuration
instance: sso
path: /app/configuration.yml
source_path: files/configuration.yml
derive: sso
restart: true
---
kind: file
name: sso-users
instance: sso
path: /app/users_database.yml
source_path: files/users_database.yml
restart: true
---
kind: instance
name: ingress
image: docker-oci:library/caddy:2.11.7-alpine
profiles: [default]
config:
  boot.autostart: "true"
  boot.autorestart: "true"
  user.tink.role: ingress
  user.tink.leg.eth0: serves, public
devices:
  eth0: {name: eth0, type: nic, network: herd0, ipv4.address: 192.0.2.3}
  # The fixture's one way in from the host, on the loopback address only and on the port a browser would use, so that a Host header carries no
  # port (qBittorrent, for one, refuses one that is not its own). A real site reaches the ingress helper through a NAT proxy device on its public address.
  https: {type: proxy, listen: "tcp:127.0.0.1:443", connect: "tcp:127.0.0.1:443"}
---
kind: file
name: ingress-caddyfile
instance: ingress
path: /etc/caddy/Caddyfile
source_path: files/Caddyfile
restart: true
---
kind: file
name: ingress-routes
instance: ingress
path: /etc/caddy/apps.caddy
source_path: files/apps.caddy
derive: caddy
restart: true
