# The herd stack "status": Uptime Kuma. Imported from the project's compose file with `tink import`; the lines marked "site:" are the
# site's half, written by hand: what is left of it once the derive stage has done the rest (a project, the offer, the name, the grant, the
# backup answer).
kind: stack
name: status
network: own                              # a bridge, its ACL and the apps' static addresses are derived (docs/network.md)
egress: none                              # site: nothing in the fixture calls out (the checks pass without it); written so that plan does not ask
project: herd-status                      # site
site: herd                              # site: only needed on a server that has a platform already (docs/join.md#sites)
---
kind: project                             # site
name: herd-status
config:
  features.profiles: "false"
---
kind: storage-volume
name: uptime-kuma-data
pool: default
backup:                                   # site
  none: "a throwaway fixture"
---
kind: instance
name: uptime-kuma
image: louislam/uptime-kuma:2
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  user.tink.offer.web.port: "3001"        # site
  user.tink.offer.web.proto: http
devices:
  # (the compose file's host port 3001 is gone: the app is reached through the ingress helper)  # site
  volume0:
    type: disk
    path: /app/data
    pool: default
    source: uptime-kuma-data
---
kind: publish                             # site: the admin UI is for admins. Its public status page cannot be opened separately: a publish is a whole name
name: status
instance: uptime-kuma
offer: web
allow: [admins]
