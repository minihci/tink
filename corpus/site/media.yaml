# The herd stack "media": Sonarr and qBittorrent. They are two projects' compose files; the stack shares one volume for /downloads between
# them, which is why they are one stack and one Incus project (a volume cannot cross projects). The compose files' host paths
# (/path/to/...) are placeholders; they become managed volumes. Imported from the project's compose file with `tink import`; the lines
# marked "site:" are the site's half, written by hand: what is left of it once the derive stage has done the rest (a project, the offer,
# the name, the grant, the backup answer).
kind: stack
name: media
network: own                              # a bridge, its ACL and the apps' static addresses are derived (docs/network.md)
project: herd-media                       # site
---
kind: project                             # site
name: herd-media
config:
  features.profiles: "false"
---
kind: storage-volume                      # site: a placeholder path became a volume
name: sonarr-config
pool: default
backup:
  none: "a throwaway fixture"
---
kind: storage-volume                      # site
name: sonarr-tv
pool: default
backup:
  none: "a throwaway fixture"
---
kind: storage-volume                      # site: shared by both apps
name: downloads
pool: default
backup:
  none: "a throwaway fixture"
---
kind: storage-volume                      # site
name: qbittorrent-config
pool: default
backup:
  none: "a throwaway fixture"
---
kind: instance
name: sonarr
image: lscr.io/linuxserver/sonarr:latest
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.PGID: "1000"
  environment.PUID: "1000"
  environment.TZ: Etc/UTC
  user.tink.offer.web.port: "8989"        # site
  user.tink.offer.web.proto: http
devices:
  volume0: {type: disk, path: /config, pool: default, source: sonarr-config}
  volume1: {type: disk, path: /tv, pool: default, source: sonarr-tv}
  volume2: {type: disk, path: /downloads, pool: default, source: downloads}
---
kind: instance
name: qbittorrent
image: lscr.io/linuxserver/qbittorrent:latest
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.PGID: "1000"
  environment.PUID: "1000"
  environment.TORRENTING_PORT: "6881"
  environment.TZ: Etc/UTC
  environment.WEBUI_PORT: "8080"
  user.tink.offer.web.port: "8080"        # site
  user.tink.offer.web.proto: http
devices:
  # (the web UI's host port 8080 is gone; the torrent port stays, on the loopback address only)  # site
  proxy1: {type: proxy, connect: "tcp:127.0.0.1:6881", listen: "tcp:127.0.0.1:6881"}
  proxy2: {type: proxy, connect: "udp:127.0.0.1:6881", listen: "udp:127.0.0.1:6881"}
  volume0: {type: disk, path: /config, pool: default, source: qbittorrent-config}
  volume1: {type: disk, path: /downloads, pool: default, source: downloads}
---
kind: publish                             # site
name: sonarr
instance: sonarr
offer: web
allow: [admins]
---
kind: publish                             # site
name: qbittorrent
instance: qbittorrent
offer: web
allow: [admins]
