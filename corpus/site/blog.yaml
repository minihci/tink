# The herd stack "blog": WordPress with MySQL. "blog" and "shop" are the same compose file twice, so each has an instance called `db`;
# each stack has a bridge of its own, so both run. Imported from the project's compose file with `tink import`; the lines marked "site:"
# are the site's half, written by hand: what is left of it once the derive stage has done the rest (a project, the offer, the name, the
# grant, the backup answer).
kind: stack
name: blog
network: own                              # a bridge, its ACL and the apps' static addresses are derived (docs/network.md)
egress: none                              # site: nothing in the fixture calls out (the checks pass without it); written so that plan does not ask
project: herd-blog                       # site
site: herd                              # site: only needed on a server that has a platform already (docs/join.md#sites)
---
kind: project                             # site
name: herd-blog
config:
  features.profiles: "false"
---
kind: storage-volume
name: db-data
pool: default
backup:                                   # site
  none: "a throwaway fixture"
---
kind: storage-volume
name: wordpress-data
pool: default
backup:                                   # site
  none: "a throwaway fixture"
---
kind: instance
name: wordpress
image: wordpress
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.WORDPRESS_DB_HOST: db
  environment.WORDPRESS_DB_NAME: exampledb
  environment.WORDPRESS_DB_PASSWORD: examplepass
  environment.WORDPRESS_DB_USER: exampleuser
  # site: the name the app is told it has, and that the proxy reached it over https (it would redirect to the wrong address otherwise)
  # Incus refuses a line break in an environment variable, so the PHP is on one line.
  environment.WORDPRESS_CONFIG_EXTRA: "define('WP_HOME', 'https://blog.home.example.org'); define('WP_SITEURL', 'https://blog.home.example.org'); if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $_SERVER['HTTPS'] = 'on'; }"
  user.tink.offer.web.port: "80"          # site
  user.tink.offer.web.proto: http
devices:
  # (the compose file's host port 8080 is gone: the app is reached through the ingress helper)  # site
  volume0:
    type: disk
    path: /var/www/html
    pool: default
    source: wordpress-data
---
kind: instance
name: db
image: mysql:8.0
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.MYSQL_DATABASE: exampledb
  environment.MYSQL_PASSWORD: examplepass
  environment.MYSQL_RANDOM_ROOT_PASSWORD: "1"
  environment.MYSQL_USER: exampleuser
devices:
  volume0:
    type: disk
    path: /var/lib/mysql
    pool: default
    source: db-data
---
kind: publish                             # site
name: blog
instance: wordpress
offer: web
allow: [family]
