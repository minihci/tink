# The herd stack "metrics": Grafana. Imported from the project's compose file with `tink import`; the lines marked "site:" are the site's
# half, written by hand: what is left of it once the derive stage has done the rest (a project, the offer, the name, the grant, the backup
# answer).
kind: stack
name: metrics
network: own                              # a bridge, its ACL and the apps' static addresses are derived (docs/network.md)
project: herd-metrics                     # site
---
kind: project                             # site
name: herd-metrics
config:
  features.profiles: "false"
---
kind: storage-volume
name: grafana-storage
pool: default
config:                                   # site: Grafana runs as uid 472 and a new volume is root's (#176); without this it exits at once
  initial.uid: "472"
  initial.gid: "0"
backup:                                   # site
  none: "a throwaway fixture"
---
kind: instance
name: grafana
image: grafana/grafana-enterprise
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.GF_SERVER_ROOT_URL: https://metrics.home.example.org   # site: the name the app is told it has
  user.tink.offer.web.port: "3000"        # site
  user.tink.offer.web.proto: http
devices:
  volume0:
    type: disk
    path: /var/lib/grafana
    pool: default
    source: grafana-storage
---
kind: publish                             # site
name: metrics
instance: grafana
offer: web
allow: [admins]
