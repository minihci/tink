# A trimmed copy of a real platform stack (tron's platform/platform.yaml): only what the join reads. The stamps are the point:
# a role on every helper, the zone on the dns helper, and a leg on each of the ingress helper's NICs.
kind: stack
name: tron-platform
project: tink
---
kind: network
name: tink0
config:
  ipv4.address: 10.10.50.1/24
  security.acls: tink0-in
---
kind: profile
name: tink-base
devices:
  root: {path: /, pool: default, type: disk}
---
kind: instance
name: identity
image: docker-oci:lldap/lldap:v0.6.3
profiles: [tink-base]
config:
  user.tink.role: identity
devices:
  eth0: {name: eth0, type: nic, network: tink0, ipv4.address: 10.10.50.10}
---
kind: instance
name: sso
image: docker-oci:authelia/authelia:4.39.28
profiles: [tink-base]
config:
  user.tink.role: sso
  user.tink.offer.web.port: "9091"
  user.tink.offer.web.proto: http
devices:
  eth0: {name: eth0, type: nic, network: tink0, ipv4.address: 10.10.50.11}
---
kind: instance
name: dns
image: docker-oci:coredns/coredns:1.14.7
profiles: [tink-base]
config:
  user.tink.role: dns
  user.tink.dns.zone: home.example.org
devices:
  eth0: {name: eth0, type: nic, nictype: bridged, parent: br0, hwaddr: "02:1a:2b:00:23:30", ipv4.address: 192.0.2.230/24, ipv4.gateway: none}
---
kind: instance
name: ingress
image: docker-oci:caddybuilds/caddy-cloudflare:2.11.7
profiles: [tink-base]
config:
  user.tink.role: ingress
  user.tink.leg.eth0: mesh
  user.tink.leg.eth1: serves
devices:
  eth0: {name: eth0, type: nic, network: tink0, ipv4.address: 10.10.50.3}
  eth1: {name: eth1, type: nic, nictype: bridged, parent: br0, hwaddr: "02:1a:2b:00:23:31", ipv4.address: 192.0.2.231/24, ipv4.gateway: none}
---
kind: instance
name: mesh
image: docker-oci:tailscale/tailscale:v1.102.5
profiles: [tink-base]
config:
  user.tink.role: mesh
devices:
  eth0: {name: eth0, type: nic, network: tink0, ipv4.address: 10.10.50.12}
