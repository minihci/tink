# Imported by `tink import` from a compose file. A starting point to review, not the stack: it states what the compose file
# says about the app, and nothing about the site (its project, network, address, name, sign-on or backup).
kind: stack
name: actual-budget
---
kind: storage-volume
name: actual-server-actual-data
pool: default
# backup: not decided. Say how this volume is backed up (`backup: {snapshots: ...}`, or `backup: {none: "why"}`); `tink plan` warns until you do.
---
# healthcheck was dropped: an image's healthcheck is not run, and nothing waits for it
kind: instance
name: actual-server
image: docker.io/actualbudget/actual-server:latest
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
devices:
  proxy0:
    type: proxy
    connect: tcp:127.0.0.1:5006
    listen: tcp:0.0.0.0:5006
  volume0:
    type: disk
    path: /data
    pool: default
    source: actual-server-actual-data
