# Imported by `tink import` from a compose file. A starting point to review, not the stack: it states what the compose file
# says about the app, and nothing about the site (its project, network, address, name, sign-on or backup).
kind: stack
name: wordpress
---
kind: storage-volume
name: db-data
pool: default
# backup: not decided. Say how this volume is backed up (`backup: {snapshots: ...}`, or `backup: {none: "why"}`); `tink plan` warns until you do.
---
kind: storage-volume
name: wordpress-data
pool: default
# backup: not decided. Say how this volume is backed up (`backup: {snapshots: ...}`, or `backup: {none: "why"}`); `tink plan` warns until you do.
---
# environment WORDPRESS_DB_PASSWORD looks like a secret and is written as it is: add it with `tink secret set` and write ${secret:NAME} instead
kind: instance
name: wordpress
image: wordpress
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.WORDPRESS_DB_HOST: db
  environment.WORDPRESS_DB_NAME: exampledb
  environment.WORDPRESS_DB_PASSWORD: examplepass
  environment.WORDPRESS_DB_USER: exampleuser
devices:
  proxy0:
    type: proxy
    connect: tcp:127.0.0.1:80
    listen: tcp:0.0.0.0:8080
  volume0:
    type: disk
    path: /var/www/html
    pool: default
    source: wordpress-data
---
# environment MYSQL_PASSWORD looks like a secret and is written as it is: add it with `tink secret set` and write ${secret:NAME} instead
kind: instance
name: db
image: mysql:8.0
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.MYSQL_DATABASE: exampledb
  environment.MYSQL_PASSWORD: examplepass
  environment.MYSQL_RANDOM_ROOT_PASSWORD: "1"
  environment.MYSQL_USER: exampleuser
devices:
  volume0:
    type: disk
    path: /var/lib/mysql
    pool: default
    source: db-data
