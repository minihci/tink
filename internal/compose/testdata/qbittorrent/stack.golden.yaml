# Imported by `tink import` from a compose file. A starting point to review, not the stack: it states what the compose file
# says about the app, and nothing about the site (its project, address, name, sign-on or backup).
kind: stack
name: qbittorrent
network: own  # a bridge of its own, made and secured by tink; egress needs it
egress: open  # compose lets a service send traffic out unless every network it is on is `internal: true`
---
# stop_grace_period was dropped: Incus has no per-instance stop timeout
kind: instance
name: qbittorrent
image: lscr.io/linuxserver/qbittorrent:latest
profiles:
  - default
config:
  boot.autorestart: "true"
  boot.autostart: "true"
  environment.PGID: "1000"
  environment.PUID: "1000"
  environment.TORRENTING_PORT: "6881"
  environment.TZ: Etc/UTC
  environment.WEBUI_PORT: "8080"
devices:
  proxy0:
    type: proxy
    connect: tcp:127.0.0.1:8080
    listen: tcp:0.0.0.0:8080
  proxy1:
    type: proxy
    connect: tcp:127.0.0.1:6881
    listen: tcp:0.0.0.0:6881
  proxy2:
    type: proxy
    connect: udp:127.0.0.1:6881
    listen: udp:0.0.0.0:6881
  volume0:
    type: disk
    path: /config
    source: /path/to/qbittorrent/appdata
  volume1:
    type: disk
    path: /downloads
    source: /path/to/downloads
